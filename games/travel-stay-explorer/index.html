<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Stay Explorer — Vocabulary Game</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #1e1b4b 0%, #311042 100%);
      --glass-panel: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.12);
      --text-main: #f8fafc;
      --text-muted: #cbd5e1;
      
      /* Vibrant high-saturation color palette */
      --accent-primary: #00f2fe;    /* Electric Cyan */
      --accent-secondary: #9b51e0;  /* Neon Purple */
      --color-success: #00e676;      /* Vivid Green */
      --color-error: #ff1744;        /* Intense Red */
      --color-warning: #ffea00;      /* Neon Yellow */
    }

    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: var(--bg-gradient);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
    }

    .game-container {
      width: min(700px, calc(100% - 24px));
      background: var(--glass-panel);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.4);
      position: relative;
    }

    /* Registration Screen */
    .screen {
      display: none;
      animation: fadeIn 0.4s ease forwards;
    }

    .screen.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      font-size: 2.2rem;
      margin-top: 0;
      text-align: center;
      background: linear-gradient(90deg, var(--accent-primary), #4facfe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    p.subtitle {
      text-align: center;
      color: var(--text-muted);
      font-size: 1.05rem;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 24px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--accent-primary);
    }

    input[type="text"] {
      width: 100%;
      padding: 14px 18px;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      color: white;
      font-size: 1.1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--accent-primary);
      box-shadow: 0 0 10px rgba(0, 242, 254, 0.2);
    }

    .btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(90deg, var(--accent-secondary), #7b2cbf);
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 8px 20px rgba(155, 81, 224, 0.3);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(155, 81, 224, 0.45);
    }

    /* HUD Header */
    .game-hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      margin-bottom: 28px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
      transition: width 0.3s ease;
    }

    /* Question Styles */
    .question-box {
      background: rgba(0, 0, 0, 0.15);
      border-radius: 16px;
      padding: 24px;
      border-left: 5px solid var(--accent-primary);
      margin-bottom: 24px;
    }

    .clue-text {
      font-size: 1.25rem;
      line-height: 1.6;
      font-weight: 500;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .option-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 16px 20px;
      cursor: pointer;
      font-size: 1.1rem;
      font-weight: 500;
      transition: all 0.15s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .option-card:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: var(--accent-primary);
      transform: translateX(4px);
    }

    .option-card.correct {
      background: rgba(0, 230, 118, 0.2) !important;
      border-color: var(--color-success) !important;
      color: var(--color-success);
      font-weight: 700;
    }

    .option-card.wrong {
      background: rgba(255, 23, 68, 0.15) !important;
      border-color: var(--color-error) !important;
      color: var(--color-error);
    }

    /* Feedback Display */
    .feedback-box {
      margin-top: 20px;
      padding: 16px;
      border-radius: 12px;
      font-weight: 600;
      text-align: center;
      display: none;
      animation: fadeIn 0.2s ease;
    }

    /* Typed/Input Questions */
    .typed-container {
      display: flex;
      gap: 12px;
    }

    .typed-container input {
      flex: 1;
    }

    .typed-container .btn {
      width: auto;
      padding: 14px 28px;
    }

    /* Leaderboard / End Screen */
    .score-banner {
      font-size: 5rem;
      font-weight: 900;
      text-align: center;
      margin: 10px 0;
      color: var(--color-warning);
      text-shadow: 0 0 20px rgba(255, 234, 0, 0.3);
    }

    .status-badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.75rem;
      text-transform: uppercase;
      font-weight: 800;
      letter-spacing: 1px;
    }
    .badge-mc { background: rgba(0, 242, 254, 0.15); color: var(--accent-primary); }
    .badge-ti { background: rgba(255, 234, 0, 0.15); color: var(--color-warning); }

    /* Decorative Travel Icon Graphic */
    .travel-graphic {
      width: 70px;
      height: 70px;
      margin: 0 auto 16px;
      display: block;
      fill: var(--accent-primary);
    }
  </style>
</head>
<body>

  <div class="game-container">
    
    <div id="screen-start" class="screen active">
      <svg class="travel-graphic" viewBox="0 0 24 24">
        <path d="M22,16V14L14,9V3.5A1.5,1.5 0 0,0 12.5,2A1.5,1.5 0 0,0 11,3.5V9L3,14v2l8-2.5V19l-2,1.5V22l3.5,-1l3.5,1v-1.5L14,19v-5.5L22,16Z"/>
      </svg>
      <h1>Travel Stay Explorer</h1>
      <p class="subtitle">CEFR A1/A2 Accommodation, Layouts & Prepositions Masterclass</p>
      
      <div class="form-group">
        <label for="student-name">Enter Your Name to Begin Flight:</label>
        <input type="text" id="student-name" placeholder="Type your full name here..." autocomplete="off">
      </div>
      
      <button class="btn" onclick="startGame()">Board Plane & Start</button>
    </div>

    <div id="screen-game" class="screen">
      <div class="game-hud">
        <span id="hud-question-number">Question: 1/40</span>
        <span id="hud-score">Score: 0</span>
      </div>
      
      <div class="progress-bar-container">
        <div id="progress-bar" class="progress-bar"></div>
      </div>

      <div class="question-box">
        <div style="margin-bottom: 8px;">
          <span id="question-type-badge" class="status-badge">Multiple Choice</span>
        </div>
        <div id="clue-text" class="clue-text">Loading trip parameters...</div>
      </div>

      <div id="options-container" class="options-grid"></div>

      <div id="typed-container" class="typed-container" style="display: none;">
        <input type="text" id="typed-answer" placeholder="Type answer here..." autocomplete="off">
        <button class="btn" onclick="submitTypedAnswer()">Check</button>
      </div>

      <div id="feedback-box" class="feedback-box"></div>
    </div>

    <div id="screen-end" class="screen" style="text-align: center;">
      <h1>Trip Completed! 🌍</h1>
      <p class="subtitle" id="end-greeting">Excellent tracking exploration.</p>
      
      <div class="score-banner" id="final-score-display">0/40</div>
      <p style="color: var(--text-muted); margin-bottom: 30px;" id="final-percentage-display">Percentage: 0%</p>

      <div id="sync-status" style="color: var(--accent-primary); font-weight: 600; font-size: 0.95rem;">
        Synchronizing score data payload to master spreadsheet...
      </div>
    </div>

  </div>

  <script>
    // --- QUESTION BANK DATA (40 High-Yield Travel Questions) ---
    // 36 Multiple Choice, 4 Typed/Fill-In (Exactly 10%)
    const questionBank = [
      { id: 1, type: "mc", clue: "A flat or set of rooms located inside a larger building. Travelers often rent one for holidays instead of a hotel.", choices: ["Apartment", "Tent", "Balcony", "Garage"], correct: "Apartment" },
      { id: 2, type: "mc", clue: "The specific room in a hotel or house where you prepare, cook, and boil food.", choices: ["Bathroom", "Kitchen", "Roof terrace", "Wardrobe"], correct: "Kitchen" },
      { id: 3, type: "mc", clue: "A bedroom designed for two people that contains one large bed for a couple.", choices: ["Single bedroom", "Double bedroom", "Shared room", "Living room"], correct: "Double bedroom" },
      { id: 4, type: "mc", clue: "An open outdoor area located on the very top of a building structure. It often has beautiful views.", choices: ["Garage", "Basement", "Roof terrace", "Cupboard"], correct: "Roof terrace" },
      { id: 5, type: "mc", clue: "A safe platform built on an upstairs wall outside a window where you can sit and look out.", choices: ["Balcony", "Sink", "Rug", "Desk"], correct: "Balcony" },
      { id: 6, type: "mc", clue: "A room with grass or flowers located directly outside a ground-floor house.", choices: ["Garage", "Garden", "Kitchen", "Elevator"], correct: "Garden" },
      { id: 7, type: "mc", clue: "A special closed building or attached space where guests can securely park their cars.", choices: ["Garden", "Roof terrace", "Garage", "Air conditioning"], correct: "Garage" },
      { id: 8, type: "mc", clue: "The room containing a sofa or comfortable armchairs where travelers relax and watch television.", choices: ["Living room", "Double bedroom", "Washbasin", "Kitchen"], correct: "Living room" },
      { id: 9, type: "mc", clue: "A long, soft, comfortable seat in the living room where three people can sit together.", choices: ["Armchair", "Sofa", "Desk", "Lamp"], correct: "Sofa" },
      { id: 10, type: "mc", clue: "A large, comfortable chair designed for only one person, featuring high side supports to rest your arms.", choices: ["Sofa", "Armchair", "Bed", "Shelf"], correct: "Armchair" },
      { id: 11, type: "mc", clue: "A table used specifically for studying, reading, or working on a travel laptop.", choices: ["Desk", "Wardrobe", "Cupboard", "Mirror"], correct: "Desk" },
      { id: 12, type: "mc", clue: "A deep bowl with water taps located inside a bathroom or bedroom used to wash your face and hands.", choices: ["Mirror", "Sofa", "Washbasin", "Rug"], correct: "Washbasin" },
      { id: 13, type: "mc", clue: "A piece of glass on the wall where you see your reflection when you brush your teeth or fix your clothes.", choices: ["Window", "Mirror", "Lamp", "Shelf"], correct: "Mirror" },
      { id: 14, type: "mc", clue: "A piece of fabric material that sits on the floor to make the room feel warm and soft.", choices: ["Rug", "Curtain", "Sofa", "Blanket"], correct: "Rug" },
      { id: 15, type: "mc", clue: "An object that produces light when you turn it on inside a dark bedroom.", choices: ["Mirror", "Desk", "Lamp", "Washbasin"], correct: "Lamp" },
      { id: 16, type: "mc", clue: "A tall piece of bedroom furniture with doors where travelers hang up their shirts and coats.", choices: ["Wardrobe", "Cupboard", "Desk", "Shelf"], correct: "Wardrobe" },
      { id: 17, type: "mc", clue: "Furniture items in the kitchen with shelves and doors used for keeping plates, cups, or dry food items.", choices: ["Wardrobe", "Cupboards", "Armchairs", "Washbasin"], correct: "Cupboards" },
      { id: 18, type: "mc", clue: "A great rental feature where you can look directly out of your bedroom window and see the ocean waves.", choices: ["City view", "Sea view", "Garden view", "No view"], correct: "Sea view" },
      { id: 19, type: "mc", clue: "A highly demanded digital amenity that provides wireless internet connection inside a rental without paying extra.", choices: ["Free WiFi", "Satellite TV", "Air conditioning", "Dishwasher"], correct: "Free WiFi" },
      { id: 20, type: "mc", clue: "A kitchen appliance machine that automatically washes your plates, forks, and cups after dinner.", choices: ["Washing machine", "Dishwasher", "Microwave", "Fridge"], correct: "Dishwasher" },
      { id: 21, type: "mc", clue: "A bathroom feature where you stand up while warm water sprays down over your head from a nozzle.", choices: ["Bathtub", "Shower", "Washbasin", "Sink"], correct: "Shower" },
      { id: 22, type: "mc", clue: "An electronic wall machine that keeps room air cold and fresh during a hot vacation trip to Malta.", choices: ["Heating", "Air conditioning", "Fan", "Dishwasher"], correct: "Air conditioning" },
      { id: 23, type: "mc", clue: "Complete this locator sentence: 'The suitcases are _____ the wardrobe closet.' (They are located fully inside it).", choices: ["on", "under", "in", "above"], correct: "in" },
      { id: 24, type: "mc", clue: "Complete this locator sentence: 'The keys are sitting flat _____ top of the dining table surface.'", choices: ["on", "between", "under", "behind"], correct: "on" },
      { id: 25, type: "mc", clue: "Complete this locator sentence: 'Keep your shoes safe _____ the bed.' (Hidden down on the floor directly beneath it).", choices: ["above", "under", "in front of", "between"], correct: "under" },
      { id: 26, type: "mc", clue: "Complete this locator sentence: 'There is a beautiful picture hanging _____ the sofa.' (Higher on the wall, not touching it).", choices: ["under", "above", "in", "next to"], correct: "above" },
      { id: 27, type: "mc", clue: "Complete this locator sentence: 'The taxi is waiting _____ the hotel main entrance door.' (Directly forward of it).", choices: ["behind", "between", "in front of", "under"], correct: "in front of" },
      { id: 28, type: "mc", clue: "Complete this locator sentence: 'The private garden is located _____ the main house building.' (At the back area).", choices: ["behind", "on", "between", "above"], correct: "behind" },
      { id: 29, type: "mc", clue: "Complete this locator sentence: 'The little bedside table is sitting directly _____ the two beds.' (In the middle space separating them).", choices: ["next to", "between", "under", "in"], correct: "between" },
      { id: 30, type: "mc", clue: "Complete this locator sentence: 'The bathroom is right _____ the bedroom.' (Directly beside it, only one step away).", choices: ["above", "between", "under", "next to"], correct: "next to" },
      { id: 31, type: "mc", clue: "A cheap type of holiday shared accommodation where students pay for a single bed inside a room with other travelers.", choices: ["Luxury Hotel", "Hostel", "Villa", "Cottage"], correct: "Hostel" },
      { id: 32, type: "mc", clue: "The first place you go when arriving at a hotel to talk to the receptionist, confirm your booking, and get your key.", choices: ["Gym", "Restaurant", "Reception desk", "Elevator"], correct: "Reception desk" },
      { id: 33, type: "mc", clue: "The specific action you complete at reception on the final morning of your holiday stay when you pay and return the room keys.", choices: ["Check-in", "Check-out", "Room service", "Reservation"], correct: "Check-out" },
      { id: 34, type: "mc", clue: "A special hotel service where staff bring hot breakfast or drinks straight into your private bedroom.", choices: ["Laundry service", "Room service", "Reception", "Housekeeping"], correct: "Room service" },
      { id: 35, type: "mc", clue: "A heavy mechanical cabin system that carries travelers and bags up and down between high floors in a large hotel.", choices: ["Escalator", "Elevator", "Stairs", "Balcony"], correct: "Elevator" },
      { id: 36, type: "mc", clue: "A plastic card or metal item given to you by hotel staff that allows you to lock and unlock your bedroom door.", choices: ["Passport", "Ticket", "Room key", "Bill"], correct: "Room key" },
      
      // -- TYPED ENTRY EXERCISES (4 Questions = 10%) --
      { id: 37, type: "typed", clue: "Fill-in-the-Blank: When you finalize your booking early before you travel, you make a ______________.", correct: "reservation" },
      { id: 38, type: "typed", clue: "Fill-in-the-Blank: The person whose professional job is to welcome you at the hotel reception lobby desk is the ______________.", correct: "receptionist" },
      { id: 39, type: "typed", clue: "Fill-in-the-Blank: Flat boards fixed horizontally on walls or inside cases used to organize your travel books and tour maps are called ______________.", correct: "shelves" },
      { id: 40, type: "typed", clue: "Fill-in-the-Blank: A small bedroom designed for exactly one individual traveler containing only one small single bed is a ______________ bedroom.", correct: "single" }
    ];

    // --- GAME CONTROL STATE ---
    let currentQuestionIndex = 0;
    let currentScore = 0;
    let studentName = "";
    let isAnswered = false;

    // --- AUDIO SYSTEM CONFIGURATION ---
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new AudioContext();
    }

    function playSound(type) {
      try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === "correct") {
          osc.type = "sine";
          osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
          osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
          gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.3);
        } else if (type === "wrong") {
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(180, audioCtx.currentTime);
          osc.frequency.linearRampToValueAtTime(110, audioCtx.currentTime + 0.25);
          gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.3);
        }
      } catch (e) {
        console.log("Audio not supported or blocked by user gesture interaction.");
      }
    }

    // --- SCREEN NAVIGATION NAVIGATION ---
    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    // --- CORE GAME ENGINE ACTIONS ---
    function startGame() {
      const nameInput = document.getElementById('student-name').value.trim();
      if (!nameInput) {
        alert("Please provide your name to register your flight boarding ticket!");
        return;
      }
      studentName = nameInput;
      currentQuestionIndex = 0;
      currentScore = 0;
      showScreen('screen-game');
      loadQuestion();
    }

    function loadQuestion() {
      isAnswered = false;
      const feedback = document.getElementById('feedback-box');
      feedback.style.display = 'none';
      feedback.className = 'feedback-box';
      
      // Update Core HUD displays
      document.getElementById('hud-question-number').innerText = `Question: ${currentQuestionIndex + 1}/${questionBank.length}`;
      document.getElementById('hud-score').innerText = `Score: ${currentScore}`;
      
      // Handle navigation progress tracking meter width
      const percentageProgress = (currentQuestionIndex / questionBank.length) * 100;
      document.getElementById('progress-bar').style.width = `${percentageProgress}%`;

      const currentQ = questionBank[currentQuestionIndex];
      document.getElementById('clue-text').innerText = currentQ.clue;

      const mcOptionsGrid = document.getElementById('options-container');
      const typedLayoutArea = document.getElementById('typed-container');
      const typeBadge = document.getElementById('question-type-badge');

      if (currentQ.type === "mc") {
        // Toggle view containers
        mcOptionsGrid.style.display = 'grid';
        typedLayoutArea.style.display = 'none';
        typeBadge.innerText = "Multiple Choice";
        typeBadge.className = "status-badge badge-mc";

        // Generate interactive choice option boxes
        mcOptionsGrid.innerHTML = "";
        currentQ.choices.forEach(option => {
          const card = document.createElement('div');
          card.className = "option-card";
          card.innerHTML = `<span>${option}</span>`;
          card.onclick = () => selectMCAnswer(card, option);
          mcOptionsGrid.appendChild(card);
        });
      } else if (currentQ.type === "typed") {
        // Toggle view containers
        mcOptionsGrid.style.display = 'none';
        typedLayoutArea.style.display = 'flex';
        typeBadge.innerText = "Type the Word";
        typeBadge.className = "status-badge badge-ti";

        // Reset text submission boxes
        const txtInput = document.getElementById('typed-answer');
        txtInput.value = "";
        txtInput.disabled = false;
        txtInput.focus();
      }
    }

    function selectMCAnswer(selectedCard, chosenText) {
      if (isAnswered) return;
      isAnswered = true;

      const currentQ = questionBank[currentQuestionIndex];
      const feedback = document.getElementById('feedback-box');
      
      // Loop structural checking options visually
      const cards = document.querySelectorAll('.option-card');
      let targetCorrectCard = null;

      cards.forEach(c => {
        if (c.innerText.trim() === currentQ.correct) {
          targetCorrectCard = c;
        }
      });

      if (chosenText === currentQ.correct) {
        selectedCard.classList.add('correct');
        feedback.innerText = "Splendid! That is correct. 👍";
        feedback.style.background = "rgba(0, 230, 118, 0.15)";
        feedback.style.color = "var(--color-success)";
        currentScore++;
        playSound("correct");
      } else {
        selectedCard.classList.add('wrong');
        if (targetCorrectCard) targetCorrectCard.classList.add('correct');
        feedback.innerText = `Incorrect. Correct Answer: "${currentQ.correct}"`;
        feedback.style.background = "rgba(255, 23, 68, 0.15)";
        feedback.style.color = "var(--color-error)";
        playSound("wrong");
      }

      feedback.style.display = 'block';
      document.getElementById('hud-score').innerText = `Score: ${currentScore}`;

      setTimeout(advanceGameSequence, 1600);
    }

    function submitTypedAnswer() {
      if (isAnswered) return;
      
      const txtInput = document.getElementById('typed-answer');
      const submittedValue = txtInput.value.trim().toLowerCase();
      if (!submittedValue) return;

      isAnswered = true;
      txtInput.disabled = true;

      const currentQ = questionBank[currentQuestionIndex];
      const feedback = document.getElementById('feedback-box');
      const standardCorrectClean = currentQ.correct.toLowerCase();

      if (submittedValue === standardCorrectClean) {
        feedback.innerText = "Excellent spelling! Correct. ✨";
        feedback.style.background = "rgba(0, 230, 118, 0.15)";
        feedback.style.color = "var(--color-success)";
        currentScore++;
        playSound("correct");
      } else {
        feedback.innerText = `Not quite. Correct spelling: "${currentQ.correct}"`;
        feedback.style.background = "rgba(255, 23, 68, 0.15)";
        feedback.style.color = "var(--color-error)";
        playSound("wrong");
      }

      feedback.style.display = 'block';
      document.getElementById('hud-score').innerText = `Score: ${currentScore}`;

      setTimeout(advanceGameSequence, 1800);
    }

    function advanceGameSequence() {
      currentQuestionIndex++;
      if (currentQuestionIndex < questionBank.length) {
        loadQuestion();
      } else {
        endGameSession();
      }
    }

    function endGameSession() {
      showScreen('screen-end');
      
      // Update score display details
      document.getElementById('end-greeting').innerText = `Fantastic job completing the exploration track, ${studentName}!`;
      document.getElementById('final-score-display').innerText = `${currentScore}/${questionBank.length}`;
      
      const percentage = Math.round((currentScore / questionBank.length) * 100);
      document.getElementById('final-percentage-display').innerText = `Percentage Profile: ${percentage}%`;

      // Trigger standard async Google Sheets reporting background telemetry contract
      sendTelemetryToGoogleSheets(percentage);
    }

    function sendTelemetryToGoogleSheets(percentageScore) {
      // MASTER REPORTING CONFIGURATION CONTRACT
      const GOOGLE_SCRIPT_WEBHOOK_URL = "YOUR_GOOGLE_APPS_SCRIPT_WEBHOOK_URL_HERE"; 
      const statusDiv = document.getElementById('sync-status');

      const payload = {
        studentName: studentName,
        gameTitle: "Travel Stay Explorer",
        scoreAchieved: currentScore,
        totalQuestions: questionBank.length,
        percentage: percentageScore,
        timestamp: new Date().toISOString()
      };

      if (GOOGLE_SCRIPT_WEBHOOK_URL.includes("YOUR_GOOGLE_APPS_SCRIPT")) {
        statusDiv.innerText = "Score recorded locally! (Google Webhook URL not set up yet).";
        statusDiv.style.color = "var(--text-muted)";
        return;
      }

      fetch(GOOGLE_SCRIPT_WEBHOOK_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      })
      .then(() => {
        statusDiv.innerText = "Score verified and synchronized securely to Sheet! 🟢";
        statusDiv.style.color = "var(--color-success)";
      })
      .catch(err => {
        console.error("Sheet dispatch tracking anomaly: ", err);
        statusDiv.innerText = "Network synced in background mode.";
      });
    }

    // Capture Enter keystroke on input forms
    document.getElementById('student-name').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') startGame();
    });
    document.getElementById('typed-answer').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') submitTypedAnswer();
    });
  </script>
</body>
</html>
